 функций при разделителе «;». В русской версии Excel при таких формулах возникает ошибка имени, поэтому в запросе прямо названы имена функций русской версии."],"self":["У каждого числа источник и дата публикации до 17.03.2025.","Пресс-релиз от 21.03.2025 и оценка инфляции «на 17 марта» в анализ не включены.","Ключевая ставка на дату оценки 21 %, решение от 25.10.2024, действует с 28.10.2024.","Интервал сегмента 71 875—161 644 руб. за 1 кв. м посчитан формулами, в сегмент не вошли дубль, другой город, доля, новостройка, снятые и поздние предложения, карточка с неверной площадью."],"fields":[{"id":"s4_rate","kind":"num","label":"Ключевая ставка на дату оценки, % годовых","value":21,"show":"21"},{"id":"s4_nseg","kind":"num","label":"Предложений в сегменте","value":9,"show":"9"},{"id":"s4_min","kind":"num","label":"Минимум сегмента, руб. за 1 кв. м","value":71875,"tol":1,"show":"71 875"},{"id":"s4_max","kind":"num","label":"Максимум сегмента, руб. за 1 кв. м","value":161644,"tol":1,"show":"161 644"},{"id":"s4_med","kind":"num","label":"Медиана сегмента, руб. за 1 кв. м","value":147765,"tol":1,"show":"147 765"},{"id":"s4_expo","kind":"num","label":"Медиана срока экспозиции снятых предложений, дней","value":82,"show":"82"},{"id":"s4_press","kind":"choice","label":"Пресс-релиз Банка России от 21.03.2025","options":[["В анализ не включается, опубликован после даты оценки",1],["Включается, оценка инфляции относится к дате оценки",0]]}],"docs":[{"key":"kr","img":"img/kr.jpg","iw":1033,"ih":1462,"short":"Банк России, 14.02","label":"Банк России, пресс-релиз от 14.02.2025, с. 1"},{"key":"ryad","img":"img/ryad.jpg","iw":1033,"ih":1462,"short":"Ряд ставки","label":"Банк России, ряд ключевой ставки, с. 1"},{"key":"infl","img":"img/infl.jpg","iw":1063,"ih":1375,"short":"Росстат, цены","label":"Росстат, индекс потребительских цен, февраль 2025, с. 1"},{"key":"yanao","img":"img/yanao.jpg","iw":1033,"ih":1462,"short":"Цены ЯНАО","label":"Росстат, цены вторичного рынка, выписка"},{"key":"pr2103","img":"img/pr2103.jpg","iw":1033,"ih":1462,"short":"Банк России, 21.03","label":"Банк России, пресс-релиз от 21.03.2025, с. 1"},{"key":"ob01","img":"img/ob01.jpg","iw":1033,"ih":1462,"short":"01","label":"Карточка объявления 01"},{"key":"ob02","img":"img/ob02.jpg","iw":1033,"ih":1462,"short":"02","label":"Карточка объявления 02"},{"key":"ob03","img":"img/ob03.jpg","iw":1033,"ih":1462,"short":"03","label":"Карточка объявления 03"},{"key":"ob04","img":"img/ob04.jpg","iw":1033,"ih":1462,"short":"04","label":"Карточка объявления 04"},{"key":"ob05","img":"img/ob05.jpg","iw":1033,"ih":1462,"short":"05","label":"Карточка объявления 05"},{"key":"ob06","img":"img/ob06.jpg","iw":1033,"ih":1462,"short":"06","label":"Карточка объявления 06"},{"key":"ob07","img":"img/ob07.jpg","iw":1033,"ih":1462,"short":"07","label":"Карточка объявления 07"},{"key":"ob08","img":"img/ob08.jpg","iw":1033,"ih":1462,"short":"08","label":"Карточка объявления 08"},{"key":"ob09","img":"img/ob09.jpg","iw":1033,"ih":1462,"short":"09","label":"Карточка объявления 09"},{"key":"ob10","img":"img/ob10.jpg","iw":1033,"ih":1462,"short":"10","label":"Карточка объявления 10"},{"key":"ob11","img":"img/ob11.jpg","iw":1033,"ih":1462,"short":"11","label":"Карточка объявления 11"},{"key":"ob12","img":"img/ob12.jpg","iw":1033,"ih":1462,"short":"12","label":"Карточка объявления 12"},{"key":"ob13","img":"img/ob13.jpg","iw":1033,"ih":1462,"short":"13","label":"Карточка объявления 13"},{"key":"ob14","img":"img/ob14.jpg","iw":1033,"ih":1462,"short":"14","label":"Карточка объявления 14"},{"key":"ob15","img":"img/ob15.jpg","iw":1033,"ih":1462,"short":"15","label":"Карточка объявления 15"},{"key":"ob16","img":"img/ob16.jpg","iw":1033,"ih":1462,"short":"16","label":"Карточка объявления 16"},{"key":"ob17","img":"img/ob17.jpg","iw":1033,"ih":1462,"short":"17","label":"Карточка объявления 17"},{"key":"ob18","img":"img/ob18.jpg","iw":1033,"ih":1462,"short":"18","label":"Карточка объявления 18"},{"key":"ob19","img":"img/ob19.jpg","iw":1033,"ih":1462,"short":"19","label":"Карточка объявления 19"},{"key":"ob20","img":"img/ob20.jpg","iw":1033,"ih":1462,"short":"20","label":"Карточка объявления 20"}],"note":"","etalon":""},{"n":5,"lesson":3,"title":"Расчет в расчетном файле","technique":"Отбор аналогов по записанным правилам, корректировки по справке одним правилом для всех аналогов, расчет формулами и контрольные формулы.","time":"120 минут","steps":["Подать строку о правилах и запрос 5.1, вставив перечень предложений сегмента из ответа 4.2. Сверить причину исключения каждого предложения с карточкой и с записанными правилами.","В той же сессии подать запрос 5.2. Каждую таблицу из ответа вставить в свой лист расчетного файла начиная с ячейки A1.","Открыть расчетный файл в Excel, проверить, что в расчетных ячейках формулы, что по контрольным формулам получено «верно», и сохранить файл. Снова запустить подготовку документов.","В новой сессии подать строку о правилах и запрос 5.3. Каждую находку проверить по ячейке и исправить в расчетном файле.","Подставить на листе «Исходные» площадь 36,7 кв. м, записать итог и вернуть 35,4 кв. м. Это измерение влияния ошибки площади."],"queries":[{"id":"5.1","env":"all","label":"Запрос 5.1","text":"По перечню предложений сегмента, приведенному ниже, отбери объекты-аналоги для квартиры, описанной в файле 03_Описание_объекта зоны «04 Результат». Сначала запиши правила отбора по подпунктам «б» и «в» пункта 22 ФСО 7 из папки «Нормы» с учетом того, по каким элементам сравнения справка о корректировках из зоны «02 Выгрузки» дает корректировки. Затем по каждому предложению дай вывод «аналог» или «исключен» с причиной по записанному правилу. Не исключай предложение по правилу, которого нет в записанном перечне.\n[перечень предложений сегмента из ответа на запрос 4.2]"},{"id":"5.2_harness","env":"all","label":"Запрос 5.2","text":"Составь листы «Исходные», «Расчет» и «Контроль» расчетного файла Excel. На листе «Исходные» размести площадь объекта с источником, этаж, этажность и наличие балкона объекта, цены предложения и площади аналогов с номером карточки, их этаж, этажность и наличие балкона, корректировки справки с номером строки и датой публикации. На листе «Расчет» формулами со ссылками на лист «Исходные» рассчитай цену 1 кв. м аналогов, корректировки на торг, на этаж и на балкон по правилам справки, итоговую и валовую корректировку, скорректированные цены, весовые коэффициенты по формуле K = (S − M) / ((N − 1) × S), где S сумма валовых корректировок всех аналогов, M валовая корректировка аналога, N число аналогов, взвешенную цену 1 кв. м, стоимость до округления и после округления до тысяч рублей, коэффициент вариации скорректированных цен. На листе «Контроль» поставь формулы суммы весов, числа аналогов и положения взвешенной цены 1 кв. м внутри интервала сегмента с листа «Рынок». Выведи каждый лист отдельной таблицей с разделителем табуляции, начиная с ячейки A1, в расчетных ячейках формулы Excel со знаком равенства и ссылками вида Исходные!B4. Имена функций и разделитель аргументов пиши для русской версии Excel (СУММ, СРЗНАЧ, СТАНДОТКЛОН, ЕСЛИ, ОКРУГЛ, точка с запятой). Чисел в расчетных ячейках не пиши."},{"id":"5.3","env":"all","label":"Запрос 5.3","text":"Проверь выгрузку расчетного файла Расчетный_файл_текст.md из зоны «03 Рабочие». Найди числа в расчетных листах вместо формул, ссылки на пустые ячейки, корректировки без источника, корректировки, которые не следуют правилам справки, и формулу весов, отличную от K = (S − M) / ((N − 1) × S). По каждой находке приведи лист, ячейку, формулу или значение и суть. Находки без ячейки не приводи."}],"check":["Итог, посчитанный в окне ответа, источником числа не служит, число берут только из расчетного файла. Совпадением итога с эталоном промежуточные величины не подтверждаются, поэтому сверяют каждую строку листа «Расчет».","Корректировка на балкон при площади с балконом считается двойным учетом. При корректировке аналога, расходящейся с правилом справки, правило применено не ко всем аналогам одинаково.","После вставки таблицы в Excel в ячейке должна стоять формула, а не текст формулы."],"answer":[{"t":"p","text":"Правила отбора. Аналог относится к сегменту однокомнатных квартир вторичного рынка Ноябрьска, расположен в основной застройке города, в панельном пятиэтажном доме без лифта, с отделкой в хорошем состоянии и без мебели в цене. На различия по этажу и балкону корректировки приведены в справке, на остальные различия корректировок в справке нет."},{"t":"table","head":["Карточка","Цена 1 кв. м, руб.","Вывод","Причина"],"rows":[["01","148 199","аналог","соответствует правилам"],["02","147 765","аналог","соответствует правилам"],["03","149 725","аналог","соответствует правилам"],["04","145 506","аналог","соответствует правилам"],["13","159 686","исключено","кирпичный девятиэтажный дом с лифтом, корректировки по справке нет"],["14","127 072","исключено","требуется капитальный ремонт, корректировки по справке нет"],["15","161 644","исключено","евроремонт, мебель и техника в цене, корректировки по справке нет"],["18","71 875","исключено","двухэтажный деревянный дом, другой тип дома, корректировки по справке нет"],["19","88 571","исключено","поселок вне основной застройки города, корректировки на местоположение по справке нет"]],"widths":[2,3,2.4,8.6]},{"t":"table","head":["Величина","Аналог 1","Аналог 2","Аналог 3","Аналог 4"],"rows":[["Цена 1 кв. м, руб.","148 199,45","147 765,36","149 725,27","145 505,62"],["Торг","−2,0 %","−2,0 %","−2,0 %","−2,0 %"],["Этаж","+3,0 %","+3,0 %","0,0 %","+5,0 %"],["Балкон","0,0 %","0,0 %","0,0 %","+0,5 %"],["Валовая корректировка","5,0 %","5,0 %","2,0 %","7,5 %"],["Скорректированная цена, руб.","149 681,44","149 243,02","146 730,77","150 598,31"],["Весовой коэффициент","0,2479","0,2479","0,2991","0,2051"]],"widths":[5,2.75,2.75,2.75,2.75]},{"t":"p","text":"Взвешенная цена 1 кв. м 148 878,17 руб., стоимость до округления 5 270 287,17 руб., итог 5 270 000 руб. Коэффициент вариации 1,11 %, взвешенная цена находится внутри интервала сегмента 71 875—161 644 руб. за 1 кв. м."},{"t":"table","head":["Вариант на листе «Варианты»","Итог, руб.","Отклонение от эталона"],"rows":[["Эталон","5 270 000","0 руб., 0,00 %"],["Площадь по выписке 36,7 кв. м","5 464 000","194 000 руб., +3,68 %"],["Аналог 4 с корректировками не по справке, этаж +3 %, балкон +3 %","5 275 000","5 000 руб., +0,09 %"],["Площадь 36,7 кв. м и аналог 4 с корректировками не по справке","5 469 000","199 000 руб., +3,78 %"]],"widths":[8.5,3,4.5]},{"t":"p","text":"При площади 36,7 кв. м с балконом и корректировке на балкон у аналога 4 балкон учтен дважды. Итог 5 469 000 руб. получен при площади 36,7 кв. м и корректировках аналога 4 +3 % и +3 %, расходящихся с правилами справки."}],"run":["В DeepSeek Harness правила отбора записаны до вывода, аналогами отобраны карточки 01—04, у каждого исключенного предложения причина по записанному правилу, как в эталоне.","Таблицы вставлены в Excel и пересчитаны. Корректировки, скорректированные цены и коэффициент вариации совпали с эталоном, но число аналогов посчитано по заполненным ячейкам столбца весов K3:K6, а в весах использована ссылка на это число. В Excel возникает предупреждение о циклической ссылке, расчет весов и итога не выполняется. После замены диапазона на столбец цен B3:B6 итог 5 270 000 руб. Число аналогов считают по столбцу исходных данных.","По запросу 5.3 найдены обе заложенные ошибки, число 0,03 вместо формулы корректировки аналога 4 на этаж и формула весов с N вместо N − 1."],"self":["Отобраны аналоги по карточкам 01—04, у каждого исключенного предложения сегмента причина по записанному правилу.","Корректировка аналога 4 на этаж +5 %, на балкон +0,5 %, аналогов 1 и 2 на этаж +3 %.","В расчетных ячейках формулы, по контрольным формулам получено «верно».","Итог 5 270 000 руб. при тех же исходных совпадает с эталоном до рубля."],"fields":[{"id":"s5_analogs","kind":"multi","label":"Карточки, отобранные аналогами","inline":true,"options":[["01",1],["02",1],["03",1],["04",1],["13",0],["14",0],["15",0],["18",0],["19",0]]},{"id":"s5_floor4","kind":"num","label":"Корректировка аналога 4 на этаж, %","value":5,"show":"+5,0"},{"id":"s5_bal4","kind":"num","label":"Корректировка аналога 4 на балкон, %","value":0.5,"show":"+0,5"},{"id":"s5_weights","kind":"nums","label":"Весовые коэффициенты аналогов 1—4, через точку с запятой","value":[0.2479,0.2479,0.2991,0.2051],"tol":0.0002,"show":"0,2479; 0,2479; 0,2991; 0,2051"},{"id":"s5_avg","kind":"num","label":"Взвешенная цена 1 кв. м, руб.","value":148878.17,"tol":0.5,"show":"148 878,17"},{"id":"s5_cv","kind":"num","label":"Коэффициент вариации, %","value":1.11,"tol":0.01,"show":"1,11"},{"id":"s5_total","kind":"num","label":"Итоговая величина, руб.","value":5270000,"show":"5 270 000"},{"id":"s5_var","kind":"num","label":"Итог при площади 36,7 кв. м, руб.","value":5464000,"show":"5 464 000","why":"Это измерение влияния ошибки площади, в расчетном файле должно быть 35,4 кв. м."}],"docs":[{"key":"spr","img":"img/spr.jpg","iw":1033,"ih":1462,"short":"Справка","label":"Справка о корректировках, с. 1"},{"key":"ob01","img":"img/ob01.jpg","iw":1033,"ih":1462,"short":"01","label":"Карточка объявления 01"},{"key":"ob02","img":"img/ob02.jpg","iw":1033,"ih":1462,"short":"02","label":"Карточка объявления 02"},{"key":"ob03","img":"img/ob03.jpg","iw":1033,"ih":1462,"short":"03","label":"Карточка объявления 03"},{"key":"ob04","img":"img/ob04.jpg","iw":1033,"ih":1462,"short":"04","label":"Карточка объявления 04"},{"key":"ob05","img":"img/ob05.jpg","iw":1033,"ih":1462,"short":"05","label":"Карточка объявления 05"},{"key":"ob06","img":"img/ob06.jpg","iw":1033,"ih":1462,"short":"06","label":"Карточка объявления 06"},{"key":"ob07","img":"img/ob07.jpg","iw":1033,"ih":1462,"short":"07","label":"Карточка объявления 07"},{"key":"ob08","img":"img/ob08.jpg","iw":1033,"ih":1462,"short":"08","label":"Карточка объявления 08"},{"key":"ob09","img":"img/ob09.jpg","iw":1033,"ih":1462,"short":"09","label":"Карточка объявления 09"},{"key":"ob10","img":"img/ob10.jpg","iw":1033,"ih":1462,"short":"10","label":"Карточка объявления 10"},{"key":"ob11","img":"img/ob11.jpg","iw":1033,"ih":1462,"short":"11","label":"Карточка объявления 11"},{"key":"ob12","img":"img/ob12.jpg","iw":1033,"ih":1462,"short":"12","label":"Карточка объявления 12"},{"key":"ob13","img":"img/ob13.jpg","iw":1033,"ih":1462,"short":"13","label":"Карточка объявления 13"},{"key":"ob14","img":"img/ob14.jpg","iw":1033,"ih":1462,"short":"14","label":"Карточка объявления 14"},{"key":"ob15","img":"img/ob15.jpg","iw":1033,"ih":1462,"short":"15","label":"Карточка объявления 15"},{"key":"ob16","img":"img/ob16.jpg","iw":1033,"ih":1462,"short":"16","label":"Карточка объявления 16"},{"key":"ob17","img":"img/ob17.jpg","iw":1033,"ih":1462,"short":"17","label":"Карточка объявления 17"},{"key":"ob18","img":"img/ob18.jpg","iw":1033,"ih":1462,"short":"18","label":"Карточка объявления 18"},{"key":"ob19","img":"img/ob19.jpg","iw":1033,"ih":1462,"short":"19","label":"Карточка объявления 19"},{"key":"ob20","img":"img/ob20.jpg","iw":1033,"ih":1462,"short":"20","label":"Карточка объявления 20"}],"note":"Если на рабочем месте собрана технологическая обвязка с памятью проекта и навыками, этап можно выполнить в ней. Ответ и контрольные точки при этом прежние.","etalon":""},{"n":6,"lesson":4,"title":"Текст отчета и сверка чисел","technique":"Раздел расчета по выгрузке расчетного файла, сборка отчета в Word по каркасу, сквозная сверка чисел и дат и правка признаков машинного текста без изменения фактов.","time":"120 минут","steps":["Подать строку о правилах и запрос 6.1. Проверить, что у каждого числа указаны лист и ячейка.","Собрать отчет в шаблоне отчета по каркасу этапа 2 из разделов этапов 2—6 и сохранить в «04 Результат» под именем Отчет_об_оценке.docx. Сохранить отчет в PDF в «Исходные файлы/04 Результат» и снова запустить подготовку документов.","В новой сессии подать строку о правилах и запрос 6.2. Каждое расхождение исправить в отчете по расчетному файлу или по документу. Таблицу сверки сохранить в «04 Результат» под именем 06_Сверка_чисел.xlsx.","В новой сессии подать запрос 6.3 по одному разделу отчета. Принять правку только там, где не изменились ни числа, ни даты, ни наименования, ни ссылки.","Сохранить исправленный отчет в Word и PDF и снова запустить подготовку документов."],"queries":[{"id":"6.1","env":"all","label":"Запрос 6.1","text":"Составь раздел отчета «Расчет рыночной стоимости сравнительным подходом» по выгрузке Расчетный_файл_текст.md из зоны «03 Рабочие». Каждое число бери только из выгрузки и после числа укажи в скобках лист и ячейку. Обоснование каждой корректировки приводи по источнику, указанному на листе «Исходные». Чисел, которых в выгрузке нет, не приводи."},{"id":"6.2","env":"all","label":"Запрос 6.2","text":"Сверь каждое число и каждую дату отчета Отчет_об_оценке.pdf из зоны «04 Результат» с выгрузкой расчетного файла и с документами зоны «01 Входящие». По каждому значению приведи страницу отчета, значение в тексте, источник (лист и ячейку или документ и страницу) и вывод «совпадает», «расходится» или «источника нет». Отдельно перечисли сведения, которые приведены в отчете в разных местах с разными значениями."},{"id":"6.3","env":"all","label":"Запрос 6.3","text":"Ниже раздел отчета. Отметь признаки машинного текста дословными цитатами, по каждой цитате укажи вид признака, затем предложи правку, в которой не изменено ни одно число, дата, наименование и ссылка. Новых сведений не добавляй.\n[текст раздела]"}],"check":["Число без листа и ячейки, число, округленное иначе, чем в расчетном файле, и вывод «совпадает» у значения, которого в выгрузке нет, считаются сбоем.","При прежней площади, дате или итоге в титуле, таблицах основных фактов, задании и заключении сквозная сверка не завершена.","Правку, в которой изменились число, дата или наименование, не принимают. К признакам машинного текста относятся анонс с числом перед перечнем, сквозная парность, обороты «важно отметить», «данный», «в рамках», «таким образом», эпитеты без числа."],"answer":[{"t":"p","text":"Ключевые значения эталонного отчета и их источник. Каждое значение приведено в отчете в нескольких местах, во всех местах одинаково."},{"t":"table","head":["Сведение","Значение","Источник","Места в отчете"],"rows":[["Общая площадь для расчета","35,4 кв. м","Технический паспорт, с. 2, лист «Исходные», B4","титул, разделы 1, 2, 7.3, 12.4, 13"],["Площадь по выписке из ЕГРН","36,7 кв. м с балконом","Выписка_ЕГРН.pdf, с. 1","разделы 1, 7.1, 7.3"],["Дата осмотра и дата оценки","17.03.2025","Акт осмотра, уточненное задание","титул, разделы 1, 2, 13"],["Дата составления отчета","18.03.2025","—","титул"],["Взвешенная цена 1 кв. м","148 878,17 руб.","лист «Расчет», B15","раздел 12.4"],["Итоговая величина","5 270 000 руб.","лист «Расчет», B17","разделы 1, 13"],["Коэффициент вариации","1,11 %","лист «Расчет», B20","раздел 12.5"],["Интервал цен сегмента","71 875—161 644 руб. за 1 кв. м","лист «Рынок»","разделы 8.3, 12.5"],["Срок экспозиции","около трех месяцев, медиана 82 дня","лист «Рынок»","разделы 1, 8.5, 10"]],"widths":[4,3.6,4.4,4]},{"t":"p","text":"Пример правки абзаца. До правки «Важно отметить, что в рамках данного отчета рынок жилой недвижимости Ноябрьска демонстрирует устойчивость. Таким образом, можно сделать вывод о стабильности цен». После правки «Цены предложений однокомнатных квартир вторичного рынка Ноябрьска на 17.03.2025 составляют от 71 875 до 161 644 руб. за 1 кв. м, медиана 147 765 руб. за 1 кв. м». Числа взяты с листа «Рынок», слова-связки и вывод без основания сняты."}],"run":["По запросу 6.1 получен раздел, в котором у каждого числа указаны лист и ячейка, итог 5 270 000 руб. совпал с эталоном. Числа перенесены без округления (вес 0,247863247863248, цена 161 643,835616438 руб.), проверка оформлена маркированным перечнем, вывод начат оборотом «таким образом». В тексте отчета числа округляют так же, как в расчетном файле.","Запрос 6.3 подан с черновиком раздела 10, в котором заложены признаки машинного текста. В ответе отмечены обороты, анонс с числом и эпитет без числа, необоснованные фразы сняты, числа и даты не изменены. Правильный оборот «типичной для сегмента площади» назван ошибкой согласования, связки заменены тире. Правку принимают только после чтения целиком.","Запрос 6.2 подан с черновиком отчета, в котором оставлены четыре прежних значения. В ответе найдены три, площадь 36,7 кв. м на титуле принята за допустимую, поскольку разница площадей объяснена в разделе 7.3. Значение с объяснением также приводят одинаково во всех местах. В ответе отмечено, что контрольной ячейкой итога на листе «Контроль» текст раздела 13 не проверяется, проверяется только внесенное в нее число."],"self":["Площадь 35,4 кв. м, дата оценки 17.03.2025 и итог 5 270 000 руб. одинаковы во всех местах отчета.","У каждого числа раздела расчета есть лист и ячейка расчетного файла.","В правке абзацев не изменено ни одно число, дата и наименование."],"fields":[{"id":"s6_area","kind":"num","label":"Площадь для расчета на титуле и в заключении, кв. м","value":35.4,"show":"35,4"},{"id":"s6_date","kind":"date","label":"Дата оценки на титуле и в заключении","value":"17.03.2025","show":"17.03.2025"},{"id":"s6_total","kind":"num","label":"Итоговая величина в заключении, руб.","value":5270000,"show":"5 270 000"},{"id":"s6_edit","kind":"choice","label":"Правку абзаца принимают, когда","options":[["Числа, даты, наименования и ссылки остались прежними",1],["Текст стал короче",0],["Отмечены все обороты",0]]}],"docs":[],"note":"Если на рабочем месте собрана технологическая обвязка с памятью проекта и навыками, этап можно выполнить в ней. Ответ и контрольные точки при этом прежние.","etalon":""},{"n":7,"lesson":4,"title":"Самопроверка перед выпуском","technique":"Свод самопроверки по требованиям ФСО VI, ФСО 7 и ФСО 9 с цитатами, перепроверка свода в новой сессии с контрольной строкой и сверка с эталоном.","time":"60 минут","steps":["Подать строку о правилах и запрос 7.1. Сохранить свод в «04 Результат» под именем 07_Свод_самопроверки.xlsx.","Исправить в отчете каждое подтвержденное нарушение.","Внести в свод контрольную строку с цитатой, которой в отчете нет, например итоговую величину, отличную от итога отчета.","В новой сессии подать строку о правилах и запрос 7.2 со сводом. Проверить, что контрольная строка снята.","В конце занятия 4 открыть эталонный отчет и эталонный расчетный файл и сверить с ними свой результат по таблице ключевых значений и перечню ловушек."],"queries":[{"id":"7.1","env":"all","label":"Запрос 7.1","text":"Проверь отчет Отчет_об_оценке.pdf из зоны «04 Результат» перед выпуском по требованиям из папки «Нормы». Пункты 7 и 8 ФСО VI, пункты 5, 8, 11, 22, 28 и 30 ФСО 7, пункты 8—10 ФСО 9. По каждому требованию приведи дословную цитату стандарта, дословную цитату отчета со страницей и один вывод «соблюдено», «нарушение», «не подтверждено», «не применимо». По каждому нарушению укажи, что исправить. Требований по памяти не приводи."},{"id":"7.2","env":"all","label":"Запрос 7.2","text":"Ты видишь эту таблицу впервые. Проверь каждую строку свода самопроверки по отчету Отчет_об_оценке.pdf и текстам папки «Нормы» и сними неподтвержденные строки, у каждой снятой строки укажи причину.\n[свод самопроверки с контрольной строкой]"}],"check":["Вывод «соблюдено» без цитаты отчета и цитату стандарта, которой нет в папке «Нормы», не принимают.","Если контрольная строка не снята, итог перепроверки в работу не принимают."],"answer":[{"t":"p","text":"В своде самопроверки эталонного отчета по каждому требованию ФСО VI, ФСО 7 и ФСО 9 стоит вывод «соблюдено» с цитатой отчета, кроме двух. Суждение о границах интервала по пункту 30 ФСО 7 не применимо, поскольку в задании указана форма представления итоговой стоимости числом. Согласование результатов разных подходов по пункту 28 ФСО 7 не применимо, применен один подход. Выводы «не подтверждено» по основанию оценки, уточненному заданию и пункту 10 ФСО 9 в учебной работе неизбежны, подписанного договора и уточненного задания в материалах нет."},{"t":"p","text":"Среди находок самопроверки перепланировка. Проем между комнатой и кухней (снимок 3) отсутствует в плане технического паспорта, документов о согласовании нет. В эталонном отчете она раскрыта в разделах 1, 4 и 7.6, итог не изменен, поскольку площадь принята по экспликации, а корректировки на перепланировку в справке нет. Свод, в котором перепланировка не названа, неполон."},{"t":"table","head":["Требование","Где исполнено в эталонном отчете"],"rows":[["ФСО VI, п. 7, подп. 1—3, дата, номер, основание, задание","Титул, разделы 1 и 2"],["ФСО VI, п. 7, подп. 4—8, оценщик, заказчик, независимость, привлеченные","Разделы 5 и 6"],["ФСО VI, п. 7, подп. 9, стандарты и методические рекомендации","Раздел 3"],["ФСО VI, п. 7, подп. 10 и 15, описание объекта и перечень документов","Раздел 7"],["ФСО VI, п. 7, подп. 11, допущения и ограничения","Раздел 4"],["ФСО VI, п. 7, подп. 12, анализ рынка; ФСО 7, п. 11","Раздел 8"],["ФСО VI, п. 7, подп. 13, подходы, расчеты, отказ от подходов; ФСО 7, п. 22","Разделы 11 и 12"],["ФСО VI, п. 7, подп. 14, итоговая стоимость и ограничения","Раздел 13"],["ФСО VI, п. 8, ссылки на источники и копии","Раздел 14, приложения 1—4"],["ФСО 7, п. 5, осмотр","Разделы 1, 7.1, акт осмотра"],["ФСО 7, п. 8, дополнительные сведения задания","Раздел 2"],["ФСО 9, п. 8—9, ликвидность и срок экспозиции","Раздел 10"],["ФСО 9, п. 10, сведения задания","Раздел 2"]],"widths":[8.5,7.5]},{"t":"table","head":["Ловушка","Этап","Где закрыта в эталоне"],"rows":[["Скрытая строка в заявке заказчика","1","Найдена скриптом подготовки, не исполнена"],["Договор купли-продажи назван, но не предоставлен","1, 2, 6","Раздел 7.1, договор в перечень не включен"],["Дата свидетельства и дата включения в реестр","1, 6","Раздел 5"],["Дата оценки не названа в задании","2, 6","Разделы 1, 2, 13, дата 17.03.2025"],["Вынужденная продажа в предпосылках рыночной стоимости","2","Раздел 2"],["Нет сведений пункта 10 ФСО 9","2","Раздел 2"],["Площадь с балконом в выписке","3, 5, 6","Разделы 7.3, 12.4"],["Технический паспорт без текстового слоя","1, 3","Раздел 7.3, экспликация по изображению"],["Сведение, опубликованное после даты оценки","4","Раздел 8, сведение не использовано"],["Значение на день запроса вместо даты оценки","4","Раздел 8.1, ключевая ставка на 17.03.2025"],["Дубль, другой город, доля, новостройка, снятые и поздние объявления, ошибка площади","4, 5","Разделы 8.2, 12.1"],["Корректировки аналога 4 не по правилу","5","Раздел 12.3"],["Двойной учет балкона","5","Разделы 7.3, 12.3"],["Число вместо формулы, веса не по формуле","5","Эталонный расчетный файл, лист «Расчет»"],["Прежние значения в разных местах отчета","6","Сквозная сверка, ответ этапа 6"],["Признаки машинного текста","6","Текст эталонного отчета"],["Проем между комнатой и кухней без документов о согласовании","3, 7","Разделы 1, 4, 7.6, площадь и итог прежние"],["Отделка после даты технического паспорта","3","Разделы 7.3, 7.6"]],"widths":[6.8,1.6,7.6]}],"run":["Запрос 7.1 выполнен в DeepSeek Harness по всем требованиям с цитатами стандартов и отчета. Прогон выполнен по эталонному отчету, в нем найдены недочеты, после прогона они исправлены. Строка допущений задания расходилась с разделом 4, не была названа причина неприменения методических рекомендаций, по подпункту «г» пункта 11 ФСО 7 не было интервалов значений факторов, в приложении были только карточки аналогов. Такие места выявляются при своде самопроверки, если каждое требование сверено с текстом стандарта.","Выводы «не подтверждено» по основанию оценки и пункту 10 ФСО 9 вызваны отсутствием подписанного договора и уточненного задания в учебных материалах. В работе с реальным объектом эти документы прикладывают к отчету.","Запрос 7.2 подан со сводом и контрольной строкой с итогом 5 469 000 руб., которого в отчете нет. В ответе контрольная строка снята, а это число найдено на листе «Варианты». Снят и прежний вывод о нарушении пункта 7 ФСО VI как неподтвержденный, поэтому каждую снятую строку читают целиком."],"self":["По каждому требованию вывод с цитатой отчета.","Контрольная строка снята при перепроверке.","Все ловушки закрыты, перепланировка названа среди находок, свой итог сверен с эталоном."],"fields":[{"id":"s7_p30","kind":"choice","label":"Вывод по пункту 30 ФСО 7, суждение о границах интервала","options":[["Не применимо",1],["Соблюдено",0],["Нарушение",0]]},{"id":"s7_p28","kind":"choice","label":"Вывод по пункту 28 ФСО 7, согласование результатов подходов","options":[["Не применимо",1],["Соблюдено",0],["Нарушение",0]]},{"id":"s7_ctrl","kind":"choice","label":"Контрольная строка при перепроверке свода","options":[["Снята",1],["Подтверждена",0]]},{"id":"s7_proem","kind":"choice","label":"Перепланировка в своде","options":[["Названа среди находок",1],["Не названа",0]]}],"docs":[],"note":"Если на рабочем месте собрана технологическая обвязка с памятью проекта и навыками, этап можно выполнить в ней. Ответ и контрольные точки при этом прежние.","etalon":"Эталонный отчет и эталонный расчетный файл составлены по тем же материалам. В расчетном файле все расчетные ячейки содержат формулы, на листе «Варианты» показано изменение итога при ошибках, заложенных в материалы. Свой отчет сверяют с эталоном по таблице ключевых значений на экране итога и по перечню ловушек в разборе этого этапа. Если состав аналогов другой, свои аналоги подставляют на лист «Исходные» эталонного расчетного файла, затем сравнивают итог и причины отбора."}],"keys":[{"label":"Общая площадь для расчета","value":"35,4 кв. м","fields":["s3_area"]},{"label":"Дата осмотра и дата оценки","value":"17.03.2025","fields":["s2_date"]},{"label":"Аналоги","value":"карточки 01, 02, 03, 04","fields":["s5_analogs"]},{"label":"Корректировки аналога 4, этаж и балкон","value":"+5 % и +0,5 %","fields":["s5_floor4","s5_bal4"]},{"label":"Весовые коэффициенты","value":"0,2479; 0,2479; 0,2991; 0,2051","fields":["s5_weights"]},{"label":"Взвешенная цена 1 кв. м","value":"148 878,17 руб.","fields":["s5_avg"]},{"label":"Итоговая величина","value":"5 270 000 руб.","fields":["s5_total"]},{"label":"Коэффициент вариации","value":"1,11 %","fields":["s5_cv"]},{"label":"Интервал цен сегмента","value":"71 875—161 644 руб. за 1 кв. м","fields":["s4_min","s4_max"]},{"label":"Срок экспозиции","value":"около трех месяцев, медиана 82 дня","fields":["s4_expo"]},{"label":"Ключевая ставка на дату оценки","value":"21 % годовых","fields":["s4_rate"]}],"files":{"materials":{"href":"files/materialy-dlya-ocenki-kvartiry.zip","name":"Материалы для оценки квартиры.zip","size":"4,1 МБ"},"nabor":{"href":"files/nabor-ocenshchika.zip","name":"Набор оценщика.zip","size":"0,3 МБ"},"report":{"href":"files/etalonnyj-otchet.pdf","name":"Эталонный_отчет.pdf","size":"4,2 МБ"},"calc":{"href":"files/etalonnyj-raschetnyj-fajl.xlsx","name":"Эталонный_расчетный_файл.xlsx","size":"14 КБ"}},"sources":{"photos":"Снимки осмотра взяты с Wikimedia Commons, автор Dmitry G, общественное достояние. На снимках 1, 3 и 4 стекла окон осветлены, остальное изображение не менялось.","links":[["Снимок 1","https://commons.wikimedia.org/wiki/File:Keskuse_14_lounge_is_ready.JPG"],["Снимок 2","https://commons.wikimedia.org/wiki/File:Keskuse_14_bedroom_is_ready.JPG"],["Снимок 3","https://commons.wikimedia.org/wiki/File:Keskuse_14_lounge_and_kitchen.JPG"],["Снимок 4","https://commons.wikimedia.org/wiki/File:Keskuse_14_kitchen_is_ready.JPG"],["Снимок 5","https://commons.wikimedia.org/wiki/File:Keskuse_14_bathroom_is_ready.JPG"]],"market":"Копии страниц официальных источников рынка получены с сайтов Банка России (www.cbr.ru) и Росстата (rosstat.gov.ru), адреса приведены на листах копий.","fonts":"Шрифты Manrope и Source Code Pro распространяются по лицензии SIL Open Font License 1.1."}};
  var STAGES = DATA.stages, LESSONS = DATA.lessons, FILES = DATA.files;
  var KEY = 'praktikum-ocenshchika-v1';
  var FIELD = {};
  STAGES.forEach(function (st) { st.fields.forEach(function (f) { FIELD[f.id] = f; }); });
  var state = load();
  var app = document.getElementById('app');
  var tabSel = {};

  function fresh() { return { screen: 'intro', env: 'harness', steps: {}, vals: {}, checked: {}, self: {} }; }
  function load() {
    try {
      var s = JSON.parse(window.localStorage.getItem(KEY));
      if (s && s.vals && s.checked && s.steps && s.self) return s;
    } catch (e) {}
    return fresh();
  }
  function save() { try { window.localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function plural(n, one, few, many) {
    var a = n % 10, b = n % 100;
    if (a === 1 && b !== 11) return one;
    if (a >= 2 && a <= 4 && (b < 12 || b > 14)) return few;
    return many;
  }
  function stage(n) { return STAGES[n - 1]; }

  /* разбор внесенных значений */
  function parseNum(s) {
    var m = String(s || '').replace(/[\s ]/g, '').replace(/−/g, '-').replace(',', '.').match(/[-+]?\d+(?:\.\d+)?/);
    return m ? parseFloat(m[0]) : null;
  }
  function parseDate(s) {
    var m = String(s || '').match(/(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})/);
    if (!m) return null;
    return ('0' + m[1]).slice(-2) + '.' + ('0' + m[2]).slice(-2) + '.' + m[3];
  }
  function verdict(f) {
    var v = state.vals[f.id];
    if (f.kind === 'multi') {
      if (!v || !v.length) return 'empty';
      return f.options.every(function (o, i) { return (v.indexOf(i) >= 0) === !!o[1]; }) ? 'ok' : 'miss';
    }
    if (f.kind === 'choice') {
      if (v == null || v === '') return 'empty';
      return f.options[v] && f.options[v][1] ? 'ok' : 'miss';
    }
    if (v == null || String(v).trim() === '') return 'empty';
    if (f.kind === 'date') return parseDate(v) === f.value ? 'ok' : 'miss';
    if (f.kind === 'nums') {
      var parts = String(v).split(/[;\n]+/).map(parseNum);
      if (parts.length !== f.value.length) return 'miss';
      return parts.every(function (p, i) { return p != null && Math.abs(p - f.value[i]) <= (f.tol || 0) + 1e-9; }) ? 'ok' : 'miss';
    }
    var n = parseNum(v);
    if (n == null) return 'miss';
    return Math.abs(n - f.value) <= (f.tol || 0) + 1e-9 ? 'ok' : 'miss';
  }
  function etalonText(f) {
    if (f.kind === 'multi') return f.options.filter(function (o) { return o[1]; }).map(function (o) { return o[0]; }).join(', ');
    if (f.kind === 'choice') return f.options.filter(function (o) { return o[1]; })[0][0];
    return f.show;
  }
  function ownText(f) {
    var v = state.vals[f.id];
    if (f.kind === 'multi') return (v || []).map(function (i) { return f.options[i][0]; }).join(', ');
    if (f.kind === 'choice') return v == null || v === '' ? '' : f.options[v][0];
    return v == null ? '' : String(v);
  }
  function stageScore(st) {
    var ok = 0;

  function firstOpen(L) {
    for (var i = 0; i < L.stages.length; i++) if (!state.checked[L.stages[i]]) return L.stages[i];

  }
  function fromHash() {
    var h = window.location.hash.replace('#', '');
    var m;
    if (h === 'prep') return 'prep';
    if (h === 'itog') return 'final';
    if ((m = h.match(/^z([1-4])$/))) {
      if (m[1] === '1' && !Object.keys(state.checked).length && !anyPrep()) return 'prep';
      return firstOpen(LESSONS[+m[1] - 1]);
    }
    if ((m = h.match(/^e([1-7])$/))) return +m[1];
    return null;
  }
  function anyPrep() { var p = state.steps.prep; return p && Object.keys(p).length > 0; }
  function go(screen) {
    state.screen = screen; save(); render();
    window.scrollTo(0, 0);

  function renderProgress() {
    var p = document.getElementById('progress');
    p.innerHTML = '';
    if (state.screen === 'intro') return;
    var seq = ['prep'].concat(STAGES.map(function (s) { return s.n; })).concat(['final']);
    var pos = seq.indexOf(state.screen);
    if (pos > 0) {
      var back = el('button', 'navbtn back', 'Назад');
      back.onclick = function () { go(seq[pos - 1]); };
      p.appendChild(back);
    }
    var groups = el('span', 'groups');
    LESSONS.forEach(function (L) {
      var dots = el('span', 'dots' + (L.stages.length > 1 ? ' two' : ''));
      L.stages.forEach(function (n) {
        var d = el('button', 'dot' + (state.checked[n] ? ' done' : '') + (state.screen === n ? ' cur' : ''), String(n));
        d.title = 'Занятие ' + L.n + ', этап ' + n + (state.checked[n] ? ', проверен' : '');
        d.setAttribute('aria-label', d.title);
        d.onclick = function () { go(n); };
        dots.appendChild(d);
      });
      groups.appendChild(dots);
    });
    p.appendChild(groups);
    if (pos < seq.length - 1) {
      var fwd = el('button', 'navbtn fwd', 'Далее');
      fwd.onclick = function () { go(seq[pos + 1]); };
      p.appendChild(fwd);
    }
    var fin = el('button', 'final-link' + (state.screen === 'final' ? ' cur' : ''), 'Итог');
    fin.onclick = function () { go('final'); };
    p.appendChild(fin);
  }

  function copyText(text, btn) {
    function done() {
      btn.textContent = 'Скопировано'; btn.classList.add('done');
      window.setTimeout(function () { btn.textContent = 'Скопировать'; btn.classList.remove('done'); }, 1500);
    }
    function fallback() {
      var ta = el('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch (e) {}
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
    else fallback();
  }

  function queryCard(label, text) {
    var q = el('div', 'query'), h = el('div', 'qh');
    h.appendChild(el('span', 'qn', label));
    var c = el('button', 'copy', 'Скопировать');
    c.onclick = function () { copyText(text, c); };
    h.appendChild(c); q.appendChild(h);
    var pre = el('pre'), pos = 0, re = /\[[^\]]+\]/g, m;
    while ((m = re.exec(text))) {
      pre.appendChild(document.createTextNode(text.slice(pos, m.index)));
      pre.appendChild(el('span', 'ph', m[0]));
      pos = m.index + m[0].length;
    }
    pre.appendChild(document.createTextNode(text.slice(pos)));
    q.appendChild(pre);
    return q;
  }

    var again = el('button', 'btn outline-white', 'Пройти заново');
    again.onclick = function () {
      if (!window.confirm('Снять все отметки и внесенные значения?')) return;
      state = fresh(); save(); go('prep');
    };
    b.appendChild(again);
    w.appendChild(b);
    hero.appendChild(w);
    app.appendChild(hero);

    var w2 = el('div', 'wrap');
    var c = el('section', 'card final-card');
    c.appendChild(el('h3', null, 'Итоговая сверка с эталоном'));
    var wrap = el('div', 'tbl'), tb = el('table', 'table-plain'), th = el('thead'), tr = el('tr');
    ['Ключевое значение', 'Эталон', 'Свое значение', 'Вывод'].forEach(function (h) { tr.appendChild(el('th', null, h)); });
    th.appendChild(tr); tb.appendChild(th);
    var body = el('tbody');
    DATA.keys.forEach(function (k) {
      var fs = k.fields.map(function (id) { return FIELD[id]; });
      var vs = fs.map(verdict);
      var v = vs.indexOf('miss') >= 0 ? 'miss' : vs.indexOf('empty') >= 0 ? 'empty' : 'ok';
      var r = el('tr');
      r.appendChild(el('td', null, k.label));
      r.appendChild(el('td', null, k.value));
      r.appendChild(el('td', null, fs.map(ownText).filter(Boolean).join('; ') || '—'));
      r.appendChild(el('td', 'v-' + v, v === 'ok' ? 'совпадает' : v === 'miss' ? 'расходится' : 'не заполнено'));
      body.appendChild(r);
    });
    tb.appendChild(body); wrap.appendChild(tb); c.appendChild(wrap);
    w2.appendChild(c);

    if (open.length) {
      var c2 = el('section', 'card final-card');
      c2.appendChild(el('h3', null, 'Контрольные точки без отметки «да»'));
      var ul = el('ul', 'open-list');
      open.forEach(function (o) {
        var li = el('li');
        var a = el('button', 'linkbtn', 'Этап ' + o.st.n + (o.no ? ', отмечено «нет».' : '.'));
        a.onclick = function () { go(o.st.n); };
        li.appendChild(a);
        li.appendChild(document.createTextNode(' ' + o.text));
        ul.appendChild(li);
      });
      c2.appendChild(ul);
      w2.appendChild(c2);
    }
    app.appendChild(w2);
  }

  /* увеличение страницы */
  var zoom = document.getElementById('zoom'), zin = document.getElementById('zoom-in'), zscale = 1;
  function openZoom(d) {
    zin.innerHTML = ''; zin.appendChild(pageImage(d, true));
    zscale = 1; applyZoom();
    zoom.classList.add('open'); zoom.setAttribute('aria-hidden', 'false'); zoom.scrollTop = 0;
  }
  function applyZoom() {
    var base = window.innerWidth <= 860 ? 2.2 : 1;
    var big = base * zscale > 1;
    zin.style.width = big ? (base * zscale * 100) + '%' : '';
    zin.style.maxWidth = big ? 'none' : '';
  }
  document.getElementById('z-plus').onclick = function () { zscale = Math.min(zscale + 0.75, 3.25); applyZoom(); };
  document.getElementById('z-minus').onclick = function () { zscale = Math.max(zscale - 0.75, 1); applyZoom(); };
  document.getElementById('z-close').onclick = function () { zoom.classList.remove('open'); zoom.setAttribute('aria-hidden', 'true'); };
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && zoom.classList.contains('open')) document.getElementById('z-close').onclick();
  });
  window.addEventListener('hashchange', function () {
    var s = fromHash();
    if (s != null) go(s);
  });

  var start = fromHash();
  if (start != null) state.screen = start;
  render();
})();
</script>
</body>
</html>
